name: upgrade-upstream-cdk-default
on:
  schedule:
    - cron: 0 6 * * 1
  workflow_dispatch: {}
jobs:
  upgrade:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.PROJEN_GITHUB_TOKEN }}
      - name: Setup Node
        id: setup_node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          package-manager-cache: false
      - name: Install dependencies
        id: install_dependencies
        run: npm ci
      - name: Check for drift in AwsCdkConstructLibraryOptions' own cdkVersion default
        id: check
        run: |-
          current=$(grep -oP "const UPSTREAM_DEFAULT_CDK_VERSION = '\K[^']+" src/projects/cdk-construct.ts)
          latest=$(grep -B3 "readonly cdkVersion: string;" node_modules/projen/lib/awscdk/awscdk-deps.d.ts | grep -oP '@default "\K[^"]+' | head -1)
          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
      - name: Bump UPSTREAM_DEFAULT_CDK_VERSION and re-synth
        id: bump_upstream_default_cdk_version_and_re-synth
        if: ${{ steps.check.outputs.current != steps.check.outputs.latest }}
        env:
          NEW_VERSION: ${{ steps.check.outputs.latest }}
          CI: "false"
        run: |-
          sed -i "s/const UPSTREAM_DEFAULT_CDK_VERSION = '.*';/const UPSTREAM_DEFAULT_CDK_VERSION = '${NEW_VERSION}';/" src/projects/cdk-construct.ts
          npx projen
      - name: Build
        id: build
        if: ${{ steps.check.outputs.current != steps.check.outputs.latest }}
        run: npm run build
      - name: Open pull request
        id: open_pull_request
        if: ${{ steps.check.outputs.current != steps.check.outputs.latest }}
        env:
          GH_TOKEN: ${{ secrets.PROJEN_GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          NEW_VERSION: ${{ steps.check.outputs.latest }}
          OLD_VERSION: ${{ steps.check.outputs.current }}
        run: |-
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          BRANCH="chore/upgrade-upstream-cdk-default-${NEW_VERSION}"
          git checkout -b "$BRANCH"
          git add -A
          git commit -m "chore: upgrade upstream-cdk-default to ${NEW_VERSION}"
          git push origin "$BRANCH" --force
          gh pr create --title "chore: upgrade upstream-cdk-default to ${NEW_VERSION}" --body "Automated upstream-cdk-default self-upgrade from ${OLD_VERSION} to ${NEW_VERSION}." --label dependencies --label auto-approve --head "$BRANCH" || echo "PR already exists for $BRANCH"
